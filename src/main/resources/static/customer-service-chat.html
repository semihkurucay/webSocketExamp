<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Birebir Canlı Destek Sistemi</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background-color: #f4f7f6; }
        .panel { background: white; padding: 20px; border-radius: 8px; max-width: 500px; margin: 0 auto 20px auto; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h3 { margin-top: 0; color: #333; text-align: center; }
        #chat-alani { display: none; }
        #mesaj-gecmisi { height: 300px; border: 1px solid #ddd; border-radius: 4px; overflow-y: auto; padding: 15px; margin-bottom: 15px; background: #fafafa; }
        .mesaj { margin-bottom: 10px; padding: 10px; border-radius: 6px; max-width: 80%; clear: both; }
        .benim-mesajim { background-color: #dcf8c6; float: right; text-align: right; border-bottom-right-radius: 0; }
        .karsi-mesaj { background-color: #fff; border: 1px solid #eee; float: left; border-bottom-left-radius: 0; }
        .temizle { clear: both; }
        .bilgi { font-size: 12px; color: #666; margin-bottom: 5px; }
        input[type="text"] { width: calc(100% - 90px); padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { padding: 10px 15px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; font-weight: bold; }
        button:hover { background: #0056b3; }
        .btn-musteri { background: #17a2b8; width: 100%; margin-bottom: 10px; }
        .btn-temsilci { background: #28a745; width: 100%; }
    </style>
</head>
<body>

    <div class="panel" id="giris-alani">
        <h3>Sisteme Giriş</h3>
        <button class="btn-musteri" onclick="musteriOlarakBaglan()">Müşteri Olarak Bağlan (Random UUID)</button>
        <button class="btn-temsilci" onclick="temsilciOlarakBaglan()">Temsilci Olarak Bağlan (customer-service)</button>
    </div>

    <div class="panel" id="chat-alani">
        <h3 id="baslik">Bağlanıldı</h3>
        <div class="bilgi"><b>Senin ID:</b> <span id="benim-id" style="color: #007bff;"></span></div>
        <div class="bilgi" style="margin-bottom: 15px;"><b>Hedef ID:</b> <span id="hedef-id" style="color: #28a745;"></span></div>
        
        <div id="mesaj-gecmisi"></div>
        <div class="temizle"></div>
        
        <div style="display: flex; gap: 10px;">
            <input type="text" id="mesaj-kutusu" placeholder="Mesajınız..." onkeypress="enterIleGonder(event)">
            <button onclick="mesajGonder()">Gönder</button>
        </div>
    </div>

    <script>
        let stompClient = null;
        let benimKimligim = "";
        let hedefKimlik = ""; 

        async function musteriOlarakBaglan() {
            try {
                // 1. Senin Java'da yazdığın REST API'ye gidip ID istiyoruz
                let response = await fetch('http://localhost:8080/api/chat/get-id');
                
                if (response.ok) {
                    // 2. Senin Java'da ürettiğin UUID'yi alıyoruz
                    let backendDenGelenId = await response.text(); 
                    
                    // 3. Kimliğimizi senin verdiğin ID olarak ayarlıyoruz
                    benimKimligim = backendDenGelenId;
                    hedefKimlik = "customer-service"; 
                    
                    // 4. Artık sisteme bağlanabiliriz
                    sistemeBaglan("Müşteri Destek Paneli");
                } else {
                    alert("Backend'den ID alınırken hata oluştu!");
                }
            } catch (error) {
                alert("Sunucuya ulaşılamıyor. Java çalışıyor mu?");
            }
        }

        function temsilciOlarakBaglan() {
            benimKimligim = "customer-service"; 
            hedefKimlik = "Bekleniyor..."; 
            sistemeBaglan("Teknik Servis Temsilci Ekranı");
        }

        function sistemeBaglan(panelBasligi) {
            document.getElementById('giris-alani').style.display = 'none';
            document.getElementById('chat-alani').style.display = 'block';
            document.getElementById('baslik').innerText = panelBasligi;
            document.getElementById('benim-id').innerText = benimKimligim;
            document.getElementById('hedef-id').innerText = hedefKimlik;

            let socket = new SockJS('http://localhost:8080/ws-chat');
            stompClient = Stomp.over(socket);
            stompClient.debug = null; 

            stompClient.connect({}, function () {
                stompClient.subscribe('/topic/messages/' + benimKimligim, function (gelenVeri) {
                    let gelenObje = JSON.parse(gelenVeri.body);
                    
                    // Backend'deki PrivateMessage modeline (from, to, message) göre okuyoruz:
                    if (benimKimligim === "customer-service") {
                        hedefKimlik = gelenObje.from; // sender değil, from oldu!
                        document.getElementById('hedef-id').innerText = hedefKimlik;
                    }

                    ekranaYaz(gelenObje.from, gelenObje.message, false); // content değil, message oldu!
                });
            });
        }

        function mesajGonder() {
            let icerik = document.getElementById('mesaj-kutusu').value.trim();
            
            if (icerik && stompClient && hedefKimlik !== "Bekleniyor...") {
                // Backend'deki PrivateMessage modeline (from, to, message) göre yolluyoruz:
                let gonderilecekObje = {
                    from: benimKimligim,
                    to: hedefKimlik,
                    message: icerik
                };

                stompClient.send("/app/private-chat", {}, JSON.stringify(gonderilecekObje));
                
                ekranaYaz("Ben", icerik, true);
                document.getElementById('mesaj-kutusu').value = '';
            }
        }

        function enterIleGonder(event) {
            if (event.key === "Enter") { mesajGonder(); }
        }

        function ekranaYaz(kimden, icerik, bendenMi) {
            let gecmis = document.getElementById('mesaj-gecmisi');
            let div = document.createElement('div');
            div.className = "mesaj " + (bendenMi ? "benim-mesajim" : "karsi-mesaj");
            
            let kimlikGosterimi = bendenMi ? "" : `<div style="font-size: 10px; color: gray; margin-bottom: 4px;">${kimden}</div>`;
            div.innerHTML = `${kimlikGosterimi}<div>${icerik}</div>`;
            
            gecmis.appendChild(div);
            
            let temizleDiv = document.createElement('div');
            temizleDiv.className = "temizle";
            gecmis.appendChild(temizleDiv);
            gecmis.scrollTop = gecmis.scrollHeight; 
        }
    </script>
</body>
</html>
